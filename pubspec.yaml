name: nzdoc_maps_mobile
description: "NZ DOC maps mobile"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  json_serializable: ^6.11.3
  modal_bottom_sheet: ^3.0.0
  google_maps_flutter: ^2.14.0
  provider: ^6.1.5+1
  go_router: ^17.0.1
  url_launcher: ^6.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/doc_icons/
